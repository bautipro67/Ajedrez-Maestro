<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Promo</title>
<link rel="stylesheet" href="promo-comun.css">
<style>
  /*
   * Guion APAISADO, 960×540. Para YouTube normal y para el GIF de itch.io.
   * El temporizado, el tablero y los datos están en promo-comun.js; aquí solo
   * va dónde se pone cada cosa en un lienzo ancho.
   */
  .cuadro { width: 960px; height: 540px; }

  .carril {
    position: absolute; left: 0; right: 0; height: 158px; overflow: hidden;
    -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 14%, #000 86%, transparent 100%);
  }
  .fila { display: flex; gap: 16px; }

  .panel {
    position: absolute;
    background: rgba(255,255,255,.05);
    border: 1.5px solid rgba(255,255,255,.11);
    border-radius: 16px;
  }
  .jugador { display: flex; align-items: center; gap: 11px; padding: 12px 14px; }
  .jugador svg { border-radius: 10px; flex: none; }
  .jugador .quien { font-size: 16px; font-weight: 800; }
  .jugador .sub { font-size: 12.5px; color: #A8A39B; font-weight: 700; }
  .reloj {
    margin-left: auto; font-variant-numeric: tabular-nums;
    font-size: 21px; font-weight: 800; letter-spacing: .01em;
    background: rgba(0,0,0,.34); border-radius: 9px; padding: 5px 11px;
  }
  .reloj.activo { background: #EBECD0; color: #1c1b18; }

  .jugadas { padding: 6px 8px 10px; display: grid; grid-template-columns: 34px 1fr 1fr; gap: 2px 4px; align-content: start; }
  .jugadas .num { font-size: 13.5px; color: #8B867E; text-align: right; padding: 4px 4px; font-weight: 700; }
  .jugadas .san { font-size: 15px; font-weight: 700; padding: 4px 7px; border-radius: 6px; }
  .jugadas .san.actual { background: rgba(129,182,76,.26); color: #DFF2C6; }

  .barraeval { width: 20px; }
  .nag { font-size: 15px; }
  .nag i { width: 20px; height: 20px; font-size: 13px; line-height: 20px; }
  .accfila { font-size: 15px; gap: 10px; }
  .accfila .quien { width: 118px; }
  .accbar { height: 9px; }
  .accfila .pct { width: 52px; }

  .modo { width: 396px; height: 150px; padding: 20px 22px; }
  .modo .icono { width: 56px; height: 56px; font-size: 28px; }
  .modo h3 { font-size: 20px; margin-bottom: 7px; }
  .modo p { font-size: 14.5px; line-height: 1.38; }

  .chip { font-size: 16px; padding: 8px 16px; }
  .mate { font-size: 23px; padding: 10px 24px; border-radius: 12px; }
</style>
</head>
<body>
<div id="hoja"></div>

<script type="module">
import {
  montar, tramo, frena, salta, tope, px, enCuadros,
  OPERA, partidaHasta, calendarioDePlys, plyEnFotograma, dibujarTablero,
  RIVALES, tarjetaRival, COMENTARIOS, MODOS, DIRECCION, logotipo,
} from './promo-comun.js';
import { botAvatarSvg, userAvatarSvg } from '../web/js/pieces.js';
import { botById } from '../web/js/bots.js';

/* ------------------------------ apertura ------------------------------ */

function escenaApertura(local) {
  return `<div class="capa" style="display:flex;align-items:center;justify-content:center">
    <div>
      ${logotipo(tramo(local, 0, 14))}
      <div class="lema" style="font-size:21px;margin-top:22px;text-align:center;
                               opacity:${frena(tramo(local, 11, 8)).toFixed(3)}">
        28 rivales con carácter propio, de 250 a 2900 de Elo.
      </div>
    </div>
  </div>`;
}

/* ------------------------------ rivales ------------------------------- */

function escenaRivales(local) {
  const entrada = frena(tramo(local, 0, 9));
  const ancho = 236 + 16;
  const arriba = RIVALES.concat(RIVALES);
  const abajo = RIVALES.slice().reverse().concat(RIVALES.slice().reverse());
  /* El avance se mide en doceavos para que a 24 fps se mueva igual de rápido. */
  const avance = (local / enCuadros(1)) * 2.55;
  const vuelta = ancho * RIVALES.length;
  const desplazaA = -(avance % vuelta);
  const desplazaB = -vuelta + ((avance * 0.82) % vuelta);
  const tarjeta = (b) => tarjetaRival(b, { ancho: 236, extra: 'min-height:126px;' });

  return `
    <div class="capa" style="opacity:${entrada.toFixed(3)}">
      <div style="position:absolute;left:56px;top:34px">
        <div class="titulo" style="font-size:40px">Cada rival juega<span class="verde"> a su manera</span></div>
        <div class="lema" style="font-size:18px;margin-top:10px">Aperturas propias, manías propias y hasta frases propias.</div>
      </div>
      <div class="carril" style="top:174px">
        <div class="fila" style="transform:translateX(${px(desplazaA)})">${arriba.map(tarjeta).join('')}</div>
      </div>
      <div class="carril" style="top:344px">
        <div class="fila" style="transform:translateX(${px(desplazaB)})">${abajo.map(tarjeta).join('')}</div>
      </div>
    </div>`;
}

/* ------------------------------ partida ------------------------------- */

const RENGLONES_VISIBLES = 8;

function relojTexto(segundos) {
  const s = Math.max(0, Math.floor(segundos));
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function listaJugadas(sanes, hasta) {
  const filas = [];
  const desde = Math.max(0, Math.ceil(hasta / 2) - RENGLONES_VISIBLES);
  for (let n = desde; n * 2 < sanes.length && n < desde + RENGLONES_VISIBLES; n += 1) {
    filas.push(`<div class="num">${n + 1}.</div>`);
    filas.push(`<div class="san${n * 2 === hasta - 1 ? ' actual' : ''}">${sanes[n * 2] || ''}</div>`);
    filas.push(`<div class="san${n * 2 + 1 === hasta - 1 ? ' actual' : ''}">${sanes[n * 2 + 1] || ''}</div>`);
  }
  return filas.join('');
}

/** El cartel entra dando un saltito en cuanto cae el mate. */
function cartelDeMate(local, cuadros, ply) {
  if (ply < OPERA.length) return '';
  const cal = calendarioDePlys(cuadros);
  const t = tope((local - cal[cal.length - 1].desde) / enCuadros(5));
  return `<div class="mate" style="right:56px;top:20px;opacity:${frena(t * 1.6).toFixed(3)};`
    + `transform:scale(${(0.72 + 0.28 * salta(t)).toFixed(3)})">Jaque mate</div>`;
}

function escenaPartida(local, e) {
  const entrada = frena(tramo(local, 0, 8));
  const ply = plyEnFotograma(local, e.cuadros);
  const estado = partidaHasta(ply);
  const rival = botById('amalia-vectores');
  const tuTiempo = 300 - Math.ceil(ply / 2) * 7.5;
  const suTiempo = 300 - Math.floor(ply / 2) * 9.2;
  const tocaBlancas = ply % 2 === 0;

  return `
    <div class="capa" style="opacity:${entrada.toFixed(3)}">
      <div style="position:absolute;left:56px;top:30px">
        <div class="titulo" style="font-size:34px">Motor propio,<span class="verde"> escrito a mano</span></div>
      </div>
      ${dibujarTablero(estado, 392, { x: 56, y: 96, extra: `transform:scale(${(0.97 + 0.03 * entrada).toFixed(3)})` })}
      ${cartelDeMate(local, e.cuadros, ply)}
      <div class="panel" style="left:496px;top:96px;width:408px;height:392px;display:flex;flex-direction:column">
        <div class="jugador" style="border-bottom:1.5px solid rgba(255,255,255,.09)">
          ${botAvatarSvg(rival, 42)}
          <div>
            <div class="quien">${rival.name}</div>
            <div class="sub">${rival.title} · ${rival.elo}</div>
          </div>
          <div class="reloj${tocaBlancas ? '' : ' activo'}">${relojTexto(suTiempo)}</div>
        </div>
        <div class="jugadas" style="flex:1;overflow:hidden">${listaJugadas(estado.sanes, ply)}</div>
        <div class="jugador" style="border-top:1.5px solid rgba(255,255,255,.09)">
          ${userAvatarSvg('promo', 42)}
          <div><div class="quien">Tú</div><div class="sub">Blancas</div></div>
          <div class="reloj${tocaBlancas ? ' activo' : ''}">${relojTexto(tuTiempo)}</div>
        </div>
      </div>
    </div>`;
}

/** Un sonido por jugada, en el fotograma en que esa jugada aparece. */
function sonidosPartida(e) {
  const cal = calendarioDePlys(e.cuadros);
  const lista = [];
  for (let i = 0; i < cal.length; i += 1) {
    const estado = partidaHasta(i + 1);
    lista.push({ cuadro: cal[i].desde, sonido: estado.sonido });
    if (estado.enJaque) lista.push({ cuadro: cal[i].desde + enCuadros(1), sonido: 'check' });
  }
  lista.push({ cuadro: cal[cal.length - 1].desde + enCuadros(3), sonido: 'win' });
  return lista;
}

/* ------------------------------ análisis ------------------------------ */

function escenaAnalisis(local) {
  const entrada = frena(tramo(local, 0, 9));
  const estado = partidaHasta(OPERA.length);
  const alturaBlancas = 50 + 50 * frena(tramo(local, 4, 14));

  return `
    <div class="capa" style="opacity:${entrada.toFixed(3)}">
      <div style="position:absolute;left:56px;top:30px">
        <div class="titulo" style="font-size:34px">Y después te explica<span class="verde"> qué pasó</span></div>
      </div>
      <div class="barraeval" style="left:56px;top:96px;height:392px">
        <div class="blancas" style="height:${alturaBlancas.toFixed(2)}%"></div>
      </div>
      ${dibujarTablero(estado, 392, { x: 90, y: 96 })}
      <div style="position:absolute;left:512px;top:96px;width:392px;display:flex;flex-direction:column;gap:20px">
        <div style="display:flex;flex-direction:column;gap:13px">
          ${COMENTARIOS.map((c, i) => {
            const o = frena(tramo(local, 6 + i * 3, 8));
            return `<div class="nag" style="opacity:${o.toFixed(3)};transform:translateX(${px((1 - o) * 22)})">
              <i style="background:${c.color}">${c.letra}</i>
              <span style="width:112px;font-variant-numeric:tabular-nums">${c.san}</span>
              <span style="color:${c.color}">${c.clase}</span>
            </div>`;
          }).join('')}
        </div>
        <div style="display:flex;flex-direction:column;gap:7px;opacity:${frena(tramo(local, 17, 9)).toFixed(3)}">
          <div class="apagado" style="font-size:13px;font-weight:900;letter-spacing:.07em">PRECISIÓN</div>
          <div class="accfila">
            <span class="quien">Tú</span>
            <span class="accbar"><i style="width:${(94 * frena(tramo(local, 18, 10))).toFixed(1)}%"></i></span>
            <span class="pct">94%</span>
          </div>
          <div class="accfila">
            <span class="quien">Amalia Reyes</span>
            <span class="accbar"><i style="width:${(61 * frena(tramo(local, 20, 10))).toFixed(1)}%;background:#8B867E"></i></span>
            <span class="pct">61%</span>
          </div>
        </div>
        <div class="lema" style="font-size:15.5px;opacity:${frena(tramo(local, 22, 8)).toFixed(3)}">
          Cada jugada clasificada, la precisión de los dos y el Elo estimado de la partida.
        </div>
      </div>
    </div>`;
}

/* -------------------------------- modos ------------------------------- */

function escenaModos(local) {
  const tarjetas = MODOS.map((m, i) => {
    const t = frena(tramo(local, 4 + i * 4, 11));
    const x = 56 + (i % 2) * 416;
    const y = 128 + Math.floor(i / 2) * 174;
    return `<div class="modo" style="left:${px(x)};top:${px(y)};opacity:${t.toFixed(3)};
                 transform:translateY(${px((1 - t) * 26)})">
      <div class="icono">${m.icono}</div>
      <div><h3>${m.titulo}</h3><p>${m.texto}</p></div>
    </div>`;
  }).join('');

  return `<div class="capa">
      <div style="position:absolute;left:56px;top:40px;opacity:${frena(tramo(local, 0, 8)).toFixed(3)}">
        <div class="titulo" style="font-size:38px">No es solo<span class="verde"> jugar una partida</span></div>
      </div>
      ${tarjetas}
    </div>`;
}

/* ------------------------------- cierre ------------------------------- */

function escenaCierre(local) {
  const chips = ['Gratis', 'Sin instalar nada', 'Sin cuenta', 'Funciona sin conexión'];
  return `
    <div class="capa" style="display:flex;flex-direction:column;align-items:center;justify-content:center;gap:30px">
      ${logotipo(tramo(local, 0, 12), { pieza: 156, titulo: 64 })}
      <div style="text-align:center;opacity:${frena(tramo(local, 9, 9)).toFixed(3)}">
        <div class="lema" style="font-size:25px">Se abre en el navegador y ya estás jugando.</div>
        <div class="verde" style="font-size:27px;font-weight:900;letter-spacing:-.01em;margin-top:13px">${DIRECCION}</div>
      </div>
      <div style="display:flex;gap:11px;opacity:${frena(tramo(local, 13, 9)).toFixed(3)}">
        ${chips.map((c, i) => `<span class="chip${i === 0 ? ' lleno' : ''}">${c}</span>`).join('')}
      </div>
    </div>`;
}

montar([
  { nombre: 'apertura', dura: 26, pinta: escenaApertura,
    sonidos: () => [{ cuadro: enCuadros(11), sonido: 'notify' }] },
  { nombre: 'rivales', dura: 44, pinta: escenaRivales,
    sonidos: () => [0, 11, 22, 33].map((u) => ({ cuadro: enCuadros(u), sonido: 'click', ganancia: 0.5 })) },
  { nombre: 'partida', dura: 78, pinta: escenaPartida, sonidos: sonidosPartida },
  { nombre: 'analisis', dura: 32, pinta: escenaAnalisis,
    sonidos: () => COMENTARIOS.map((_, i) => ({ cuadro: enCuadros(6 + i * 3), sonido: 'click', ganancia: 0.7 })) },
  { nombre: 'modos', dura: 34, pinta: escenaModos,
    sonidos: () => MODOS.map((_, i) => ({ cuadro: enCuadros(4 + i * 4), sonido: 'click', ganancia: 0.7 })) },
  { nombre: 'cierre', dura: 30, pinta: escenaCierre,
    sonidos: () => [{ cuadro: enCuadros(1), sonido: 'gameStart' }] },
]);
</script>
</body>
</html>
