<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Simulacro de itch.io</title>
<style>
  /* itch.io mete el juego en un iframe de tamaño fijo y con scrolling="no".
     Ese atributo apaga el scroll de la ventana de dentro, que es justo lo que
     rompia la navegacion alli. Esta pagina reproduce ese marco para poder
     comprobarlo sin subir nada. */
  body { margin: 0; background: #2b2b2b; color: #eee; font: 14px system-ui; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px; }
  iframe { border: 0; display: block; box-shadow: 0 0 0 2px #81B64C; }
</style>
</head>
<body>
  <p>Marco de 960×600 con <code>scrolling="no"</code>, igual que itch.io.</p>
  <iframe id="juego" src="../web/index.html" width="960" height="600" scrolling="no"></iframe>
</body>
</html>
